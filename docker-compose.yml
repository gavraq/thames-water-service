services:
  thames-water-service:
    build: .
    container_name: thames-water-service
    restart: unless-stopped
    hostname: thames-water-service

    # Run tini as PID 1 so zombie chromium subprocesses are reaped.
    # Without this, uvicorn becomes PID 1 and never wait()s on orphaned
    # Chrome children, so they pile up until fork() fails inside the container.
    init: true

    # Hard cap on processes to fail loudly if a leak ever recurs,
    # rather than silently accumulating thousands of zombies.
    pids_limit: 200

    ports:
      - "8096:8096"

    volumes:
      # Database storage (persists between restarts)
      - ./data:/app/data

      # Service logs
      - ./logs:/app/logs

    # Secrets are loaded from .env via env_file rather than ${VAR} interpolation,
    # because Compose v2 double-interpolates the result of ${VAR} expansion. A
    # password containing literal `$` characters then gets eaten as an undefined
    # variable reference and ends up empty in the container.
    env_file:
      - .env

    environment:
      # seleniarm base image sets HOME=/home/seluser, which appuser (uid 1000)
      # cannot write; chromium's crashpad then kills every scraper launch.
      # Bind-mounted data/ and logs/ on the host must also be owned by uid 1000.
      - HOME=/tmp
      - PORT=8096
      - LOG_LEVEL=info
      - DB_PATH=/app/data/thames_water.db
      - SPIKE_THRESHOLD=800

      # Scheduler configuration
      - DAILY_FETCH_HOUR=6
      - DAILY_FETCH_MINUTE=0
      - WEEKLY_VERIFY_DAY=sun
      - WEEKLY_VERIFY_HOUR=7

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
